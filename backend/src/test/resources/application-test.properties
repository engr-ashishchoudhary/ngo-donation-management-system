# =============================================================================
# Test Application Configuration
# =============================================================================
spring.application.name=ngo-donation-management-system-test

# =============================================================================
# Test MySQL Database Connection Configuration (Targeting ngo_donation_test_db ONLY)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ngo_donation_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA & Hibernate Configuration
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# JWT Security Configuration (Dedicated test secret >= 256 bits)
# =============================================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# =============================================================================
# Initial Admin Bootstrap Configuration (Test SUPER_ADMIN initialization)
# =============================================================================
app.security.initial-super-admin-password=SuperAdmin@Test123
